name: release

# 只允许发布「已经合进默认分支」的提交。
# 推 v* tag 后先核对版本、祖先关系、测试与打包清单，再建 Release。
# 这个插件不发 npm（只走 GitHub 分发），所以没有 npm 步骤——不是漏了。
# CHANGELOG 是 Release 正文的唯一来源。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新生成正文的已有 tag，例如 v0.2.17
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: tag 必须对应 package.json，且提交已合进默认分支
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "tag $REF_NAME 与 package.json 的版本 $expected 不一致" >&2
            exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH" --quiet
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "这个 tag 的提交尚未合进 $DEFAULT_BRANCH，拒绝发布" >&2
            exit 1
          fi

      - name: 测试与打包清单
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          elif compgen -G 'tests/*.test.mjs' > /dev/null; then
            node --test tests/*.test.mjs
          else
            echo "没有可自动运行的语义测试" >&2
            exit 1
          fi
          npm pack --dry-run

  release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: 从 CHANGELOG.md 抽出这个版本的条目
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "没有 CHANGELOG.md，拒绝建空 Release" >&2
            exit 1
          fi
          awk -v ver="$ver" '
            /^## / {
              if (f) exit
              if (substr($0, 4, length(ver)) == ver) { f = 1; next }
            }
            f { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md 里没有 $ver 这一节，拒绝建空 Release" >&2
            exit 1
          fi
          echo "--- Release 正文 ---"
          cat notes.md

      - name: 建 Release（已存在则刷新正文）
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release edit "$REF_NAME" \
              --title "$REF_NAME" \
              --notes-file notes.md \
              --draft=false
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --notes-file notes.md
          fi
